name: CI / Automated Testing & Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate synthetic dataset & train pipeline
      run: |
        python run_project.py --generate-data
        python run_project.py --train

    - name: Run empirical benchmark evaluation
      run: |
        python run_project.py --benchmark

    - name: Run full pytest test suite
      run: |
        pytest -v tests/
